[project]
name = "amethyst"
version = "0.1.0"
description = "Personal operating system: one AI interface to your apps, information, tasks and tools"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "mcp>=2.0",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "keyring>=25.0",
    "httpx>=0.27",
    "python-dateutil>=2.9",
    "python-multipart>=0.0.9",   # file uploads from the browser composer
]

[project.optional-dependencies]
providers = [
    "openai>=1.55",
    "anthropic>=0.40",
]
vector = [
    "sqlite-vec>=0.1.6",
]
# Opening an Instagram permalink. Optional because it is the fallback route: the
# Meta API is the right one and needs none of this. See backend/media/reel.py for
# what that fallback costs.
reels = [
    "yt-dlp>=2026.8",
    "shazamio>=0.8.0",
]
# Reading and writing the documents that are not text -- PDF, Word, Excel,
# PowerPoint. Optional because the index and every tool still work without them:
# reading falls back to pdftotext for PDF and to a zip reader for PowerPoint, and
# anything with no route left says so by name. Writing has no fallback -- there is
# no honest way to author a .docx without a library that understands one.
documents = [
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
]
# The tray process: an icon, a global hotkey, and the autostart entry. Optional
# because the daemon is the server, and the server needs none of it -- `amethyst
# serve` is unchanged and `amethyst desktop` says what to install if it is asked
# for without these.
desktop = [
    # A window of AMETHYST's own, so the hotkey raises something instead of asking a
    # browser to. Uses the system webview -- WebKit2GTK on Linux, Edge on Windows,
    # Cocoa on macOS -- so it ships no engine of its own. On Linux that means the
    # distribution's PyGObject and WebKit2GTK have to be reachable from this
    # environment (a venv made with --system-site-packages, or the packages
    # installed into it); without them AMETHYST falls back to the browser and says so.
    "pywebview>=5.0",
    "pystray>=0.19",
    "pynput>=1.7",
    "pillow>=10",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
amethyst = "backend.cli:main"
# The keyboard shortcut's own entry point. See backend.desktop.main_palette
# for why it does not go through the `amethyst` CLI.
amethyst-palette = "backend.desktop:main_palette"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Live tests spawn real MCP servers and reach the network; opt in with `pytest -m live`.
addopts = "-m 'not live'"
markers = ["live: exercises real MCP servers and the network"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
