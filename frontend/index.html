<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="AMETHYST — your personal operating system. One agent over your files, shell, tasks, calendar and connected services." />
    <title>AMETHYST · personal operating system</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The API's own preconnect is added from api.js rather than written here.
         An env placeholder that no build defined stays in the markup verbatim
         as a broken href, and the same-origin build has no second host to
         connect to at all. (The placeholder's own name is deliberately not
         written in this comment: Vite scans the file as text, warns that the
         variable is undefined, and the warning is right about the syntax and
         wrong about there being a problem.) -->

    <!-- The faces DESIGN.md names -- CursorGothic and berkeleyMono -- are both
         licensed, so this loads substitutes in their place. Geist rather than
         the Inter the file suggests: Inter is the default every interface
         reaches for and reads as one, and Geist is the same kind of grotesk
         with more of a face on it. EB Garamond carries the display sizes, Geist
         Mono the technical voice. Weight 500 is the ceiling on purpose -- the
         display sizes are set at 400 and tightened with tracking, and nothing
         in the interface is allowed to be bolder than a label. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=EB+Garamond:wght@400;500&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
