<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="fav-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="fav-facet-table" x1="21" y1="12" x2="43" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E9D5FF"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="fav-facet-center" x1="32" y1="24" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9E5CFF"/>
      <stop offset="100%" stop-color="#7132F5"/>
    </linearGradient>
    <linearGradient id="fav-facet-left" x1="12" y1="24" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#581C87"/>
    </linearGradient>
    <linearGradient id="fav-facet-right" x1="52" y1="24" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6B21A8"/>
    </linearGradient>
    <linearGradient id="fav-facet-crown-l" x1="12" y1="12" x2="21" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DDD6FE"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="fav-facet-crown-r" x1="52" y1="12" x2="43" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F3E8FF"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#fav-bg)"/>
  <rect width="64" height="64" rx="16" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <g transform="translate(0, 1)">
    <!-- Crown Left -->
    <polygon points="22,12 12,24 21,24" fill="url(#fav-facet-crown-l)"/>
    <!-- Crown Right -->
    <polygon points="42,12 43,24 52,24" fill="url(#fav-facet-crown-r)"/>
    <!-- Table (Top Center) -->
    <polygon points="22,12 42,12 43,24 21,24" fill="url(#fav-facet-table)"/>

    <!-- Pavilion Left -->
    <polygon points="12,24 21,24 32,52" fill="url(#fav-facet-left)"/>
    <!-- Pavilion Right -->
    <polygon points="52,24 43,24 32,52" fill="url(#fav-facet-right)"/>
    <!-- Pavilion Center -->
    <polygon points="21,24 43,24 32,52" fill="url(#fav-facet-center)"/>

    <!-- Facet Dividers -->
    <path d="M22 12L21 24M42 12L43 24M21 24L32 52M43 24L32 52M12 24L52 24" stroke="rgba(255,255,255,0.3)" stroke-width="0.75" stroke-linejoin="round"/>
    <polygon points="22,12 42,12 52,24 32,52 12,24" stroke="rgba(255,255,255,0.2)" stroke-width="0.75" stroke-linejoin="round"/>
  </g>
</svg>